<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>地图最小验证 · 高德本地瓦片</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; }
  #map { height: 100%; }
  #info {
    position: absolute; top: 8px; left: 8px; z-index: 1000;
    background: rgba(255,255,255,.92); padding: 8px 12px;
    border-radius: 6px; font: 13px/1.6 monospace;
  }
  #log { max-height: 30vh; overflow-y: auto; max-width: 46vw; white-space: pre-wrap; }
  .err { color: #c62828; } .ok { color: #2e7d32; }
</style>
</head>
<body>
<div id="map"></div>
<div id="info">
  <b>地图最小验证 · 高德本地瓦片（GCJ-02）</b><br>
  版本 MINI-2 · <span id="count"></span><br>
  <div id="log"></div>
</div>
<script>
  const logEl = document.getElementById('log')
  let loaded = 0, errors = 0
  function log(msg, cls) {
    const line = document.createElement('div')
    if (cls) line.className = cls
    line.textContent = msg
    logEl.appendChild(line)
    logEl.scrollTop = logEl.scrollHeight
  }
  function update() {
    document.getElementById('count').textContent = `瓦片 loaded=${loaded} error=${errors}`
  }

  // 高德瓦片是 GCJ-02：视角中心用 GCJ-02 坐标，与下载脚本的换算一致
  const GCJ = [39.10536, 116.10597] // ≈ WGS84 39.1003,116.1003
  const map = L.map('map', {
    attributionControl: true, minZoom: 13, maxZoom: 18,
  }).setView(GCJ, 15)

  const layer = L.tileLayer('/gdmaptiles/{z}/{x}/{y}.png', {
    minZoom: 13, maxZoom: 18,
    attribution: '© 高德地图 (local cache)',
  })
  layer.on('tileload', () => { loaded++; update() })
  layer.on('tileerror', (e) => {
    errors++; update()
    log('ERR ' + (e.url ?? '(no url)'), 'err')
  })
  layer.addTo(map)

  L.circleMarker(GCJ, { radius: 8, color: '#15803d', weight: 3 })
    .bindTooltip('演示田中心（GCJ-02 视角）').addTo(map)

  setTimeout(() => {
    log('=== 10 秒小结 ===')
    log(`loaded=${loaded} error=${errors}`)
    log(errors === 0 ? '✓ 全部本地命中，高德底图链路健康' : '✗ 存在失败瓦片，看上方 ERR 行 URL', errors === 0 ? 'ok' : 'err')
  }, 10000)
</script>
</body>
</html>
